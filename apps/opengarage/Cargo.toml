[package]
name = "opengaragemusic"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
vst3 = "0.3"
og-engine = { path = "../../crates/og-engine" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
cpal = "0.15"
midir = "0.10"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap-sys = "0.5"
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6"

[dev-dependencies]
og-clap-test = { path = "../../tools/og-clap-test" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
